[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-factory"
version = "0.1.0"
description = "Fábrica de software con agentes: intake → spec → build (TDD) → revisión paralela → aprobador → gate humano/producción."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
ui = ["playwright>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
factory = "ai_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
ai_factory = ["factory.example.toml"]
