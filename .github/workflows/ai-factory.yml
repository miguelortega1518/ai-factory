# Copia este workflow al repositorio que quieres que la AI Factory mantenga.
name: AI Factory

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "17 * * * *"   # revisa Sentry/issues pendientes cada hora
  workflow_dispatch:
    inputs:
      task:
        description: "Tarea en texto libre"
        required: false
      issue:
        description: "Número de issue (lo usa `factory retry-paused` para relanzar tras el límite de uso)"
        required: false

      resume_run_id:
        description: "Ejecución a recuperar (requiere issue y checkpoint_artifact)"
        required: false
      checkpoint_artifact:
        description: "ID del artefacto de recuperación"
        required: false

permissions:
  actions: read  # validar y descargar puntos de recuperación
  contents: write
  pull-requests: write
  issues: write   # para comentar el resultado y cerrar el issue

# Una ejecución por issue: varias tareas avanzan en paralelo sin cancelarse entre sí.
# Si dos fusionan a la vez, la fábrica incorpora la otra, vuelve a verificar y reintenta.
concurrency:
  group: ai-factory-${{ github.event.issue.number || github.event.inputs.issue || github.run_id }}
  cancel-in-progress: false

jobs:
  factory:
    if: github.event_name != 'issues' || github.event.label.name == 'ai-factory'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar AI Factory, Claude Code y dependencias del proyecto
        run: |
          # Claude Code (backend = "claude-code"). Instalador nativo: siempre la última versión.
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version
          pip install "ai-factory @ git+https://github.com/${{ vars.AI_FACTORY_REPO || 'OWNER/ai-factory' }}"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Configurar git
        run: |
          git config user.name "ai-factory[bot]"
          git config user.email "ai-factory@users.noreply.github.com"
      - name: Instalar transporte de checkpoints
        run: npm install --prefix "$RUNNER_TEMP/factory-artifact-client" --ignore-scripts --no-audit --no-fund @actions/artifact@2.3.2

      - name: Ejecutar con recuperación
        uses: actions/github-script@v7
        env:
          # Usa uno de los dos: API key (backend "api") o token de suscripción (backend "claude-code").
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Opcional: registrar el trabajo en Forja (sección [forja] de factory.toml).
          FORJA_EMAIL: ${{ secrets.FORJA_EMAIL }}
          FORJA_PASSWORD: ${{ secrets.FORJA_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          # Por variable de entorno, no interpolados en el script: evita inyección de comandos.
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TASK_TEXT: ${{ github.event.inputs.task }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue }}
          RESUME_RUN_ID: ${{ github.event.inputs.resume_run_id }}
          CHECKPOINT_ARTIFACT: ${{ github.event.inputs.checkpoint_artifact }}
        with:
          script: |
            const {spawnSync} = require('node:child_process');
            const path = require('node:path');
            const locate = spawnSync('python', ['-c', 'import ai_factory, pathlib; print(pathlib.Path(ai_factory.__file__).parent / "upload-checkpoint.cjs")'], {encoding:'utf8'});
            if (locate.status !== 0) throw new Error('No se encontró AI Factory');
            const uploader = locate.stdout.trim();
            const env = {...process.env,
              FACTORY_CHECKPOINT_UPLOADER: `node "${uploader}"`,
              FACTORY_ARTIFACT_MODULE: path.join(process.env.RUNNER_TEMP, 'factory-artifact-client/node_modules/@actions/artifact')};
            const issue = env.ISSUE_NUMBER || env.DISPATCH_ISSUE;
            let args;
            if (env.RESUME_RUN_ID || env.CHECKPOINT_ARTIFACT) {
              if (!issue || !/^[0-9]+$/.test(env.CHECKPOINT_ARTIFACT || '') || !/^[\w-]+$/.test(env.RESUME_RUN_ID || '')) {
                throw new Error('La recuperación requiere issue, resume_run_id y checkpoint_artifact válidos');
              }
              args = ['resume', env.RESUME_RUN_ID, '--artifact-id', env.CHECKPOINT_ARTIFACT, '--github-issue', issue];
            } else if (issue) {
              args = ['run', '--github-issue', issue];
            } else if (env.EVENT_NAME === 'schedule') {
              args = ['intake', '--limit', '3'];
            } else {
              args = ['run', '--task', env.TASK_TEXT || ''];
            }
            // argv, never shell interpolation of issue/task inputs. Runtime artifact credentials
            // are available here and stripped from subprocesses used by agents/tests.
            const result = spawnSync('factory', args, {env, stdio:'inherit'});
            if (result.error) throw result.error;
            if (result.status !== 0) core.setFailed(`AI Factory terminó con código ${result.status}`);

      - name: Guardar auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-factory-${{ github.run_id }}
          path: .factory/runs/
